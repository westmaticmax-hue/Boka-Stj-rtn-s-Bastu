<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      viewport-fit=cover">

<title>Boka bastun</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: #fff;

    background:
        radial-gradient(
            circle at 90% 0%,
            #713d20 0%,
            #3a1d10 35%,
            #170d08 75%
        );

    padding:
        calc(env(safe-area-inset-top) + 25px)
        18px
        calc(env(safe-area-inset-bottom) + 30px);
}

.app {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
}

/* ---------------- HEADER ---------------- */

.header {
    display: flex;
    align-items: center;
    gap: 18px;

    margin: 10px 10px 28px;
}

.fire {
    width: 84px;
    height: 84px;

    border-radius: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 48px;

    background:
        linear-gradient(
            145deg,
            rgba(255,180,80,.25),
            rgba(80,35,15,.3)
        );

    border: 1px solid rgba(255,180,90,.25);

    box-shadow:
        0 10px 35px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.1);
}

.header h1 {
    margin: 0;

    font-size: 36px;
    line-height: 1.05;

    letter-spacing: -1.5px;
}

.header p {
    margin: 8px 0 0;

    font-size: 19px;

    color: rgba(255,255,255,.65);
}

/* ---------------- CARDS ---------------- */

.card {
    background:
        rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.13);

    border-radius: 32px;

    padding: 28px;

    margin-bottom: 22px;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 15px 45px rgba(0,0,0,.2),
        inset 0 1px 0 rgba(255,255,255,.05);
}

/* ---------------- STATUS ---------------- */

.status-card {
    position: relative;
    overflow: hidden;

    min-height: 225px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.status-card::after {
    content: "";

    position: absolute;

    width: 240px;
    height: 240px;

    right: -90px;
    top: -100px;

    border-radius: 50%;

    background:
        rgba(180,90,40,.16);

    pointer-events: none;
}

.label {
    font-size: 16px;
    font-weight: 700;

    letter-spacing: 3px;

    color: rgba(255,255,255,.65);

    margin-bottom: 12px;
}

.status-title {
    font-size: 48px;
    font-weight: 800;

    letter-spacing: -2px;

    margin: 0 0 8px;
}

.status-info {
    font-size: 20px;

    color: rgba(255,255,255,.68);
}

.status-badge {
    position: absolute;

    right: 28px;
    top: 85px;

    z-index: 2;

    padding: 13px 20px;

    border-radius: 999px;

    font-size: 17px;
    font-weight: 800;

    letter-spacing: 2px;

    border: 1px solid rgba(110,220,130,.3);

    background:
        rgba(100,190,100,.10);

    color: #78dc94;
}

.status-badge.busy {
    color: #ff9a85;

    border-color:
        rgba(255,110,90,.35);

    background:
        rgba(255,90,70,.10);
}

/* ---------------- QUICK BUTTONS ---------------- */

.quick {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 5px;

    padding: 6px;

    margin-bottom: 22px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.12);
}

.quick button {
    border: 0;

    background: transparent;

    color: rgba(255,255,255,.7);

    padding: 19px 5px;

    border-radius: 25px;

    font-size: 20px;
    font-weight: 700;

    cursor: pointer;
}

.quick button.active {
    color: #fff;

    background:
        rgba(255,255,255,.09);
}

/* ---------------- FORM ---------------- */

.section-title {
    font-size: 16px;

    font-weight: 700;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.65);

    margin-bottom: 14px;
}

.field {
    margin-bottom: 25px;
}

input,
select {

    width: 100%;

    height: 68px;

    border-radius: 24px;

    border:
        1px solid rgba(255,255,255,.14);

    background:
        rgba(255,255,255,.07);

    color: #fff;

    font-size: 22px;

    font-weight: 650;

    padding: 0 24px;

    outline: none;
}

input:focus,
select:focus {
    border-color:
        rgba(255,170,80,.5);
}

select option {
    color: #111;
}

/* ---------------- PREVIEW ---------------- */

.preview {

    margin-top: 5px;
    margin-bottom: 26px;

    padding: 23px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,150,60,.12),
            rgba(255,100,40,.07)
        );

    border:
        1px solid rgba(255,150,70,.25);
}

.preview-label {
    font-size: 15px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,.65);

    font-weight: 700;

    margin-bottom: 10px;
}

.preview-time {

    font-size: 34px;

    font-weight: 800;

    letter-spacing: -1px;
}

.preview-date {

    margin-top: 5px;

    font-size: 17px;

    color:
        rgba(255,255,255,.62);
}

/* ---------------- BOOK BUTTON ---------------- */

.book-button {

    width: 100%;

    min-height: 78px;

    border: 0;

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            #ffad48,
            #ff613c
        );

    color: #140904;

    font-size: 27px;

    font-weight: 850;

    cursor: pointer;

    box-shadow:
        0 15px 35px rgba(255,100,40,.20);

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.book-button:active {
    transform: scale(.98);
}

.book-button:disabled {
    opacity: .45;
    cursor: default;
}

/* ---------------- MESSAGE ---------------- */

.message {

    display: none;

    padding: 20px;

    margin-bottom: 22px;

    border-radius: 24px;

    font-size: 18px;

    font-weight: 650;

    line-height: 1.4;
}

.message.error {

    display: block;

    color: #ffaaa0;

    background:
        rgba(150,40,30,.20);

    border:
        1px solid rgba(255,90,70,.30);
}

.message.success {

    display: block;

    color: #9be7aa;

    background:
        rgba(40,130,60,.16);

    border:
        1px solid rgba(100,220,120,.25);
}

/* ---------------- BOOKINGS ---------------- */

.booking-list {

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.booking {

    padding: 20px;

    border-radius: 24px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.10);
}

.booking-date {

    font-size: 14px;

    letter-spacing: 2px;

    font-weight: 750;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 6px;
}

.booking-time {

    font-size: 27px;

    font-weight: 800;
}

.booking-duration {

    margin-top: 4px;

    font-size: 16px;

    color:
        rgba(255,255,255,.55);
}

.empty {

    text-align: center;

    padding: 25px;

    color:
        rgba(255,255,255,.5);

    font-size: 18px;
}

/* ---------------- FOOTER ---------------- */

.footer {

    text-align: center;

    margin-top: 30px;

    font-size: 13px;

    color:
        rgba(255,255,255,.35);
}

/* ---------------- MOBILE ---------------- */

@media(max-width: 500px) {

    body {
        padding-left: 14px;
        padding-right: 14px;
    }

    .header {
        margin-left: 6px;
        margin-right: 6px;
    }

    .fire {
        width: 74px;
        height: 74px;
        border-radius: 25px;
        font-size: 42px;
    }

    .header h1 {
        font-size: 31px;
    }

    .header p {
        font-size: 17px;
    }

    .card {
        padding: 24px;
        border-radius: 28px;
    }

    .status-title {
        font-size: 43px;
    }

    .status-badge {
        right: 20px;
        top: 76px;
        font-size: 14px;
        padding: 11px 15px;
    }

    .preview-time {
        font-size: 31px;
    }

    .book-button {
        font-size: 24px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="fire">
            🔥
        </div>

        <div>
            <h1>Boka bastun</h1>
            <p>Lugn värme. Enkelt bokat.</p>
        </div>

    </header>


    <!-- STATUS -->

    <section class="card status-card">

        <div class="label">
            STATUS JUST NU
        </div>

        <div
            id="statusTitle"
            class="status-title">
            Hämtar...
        </div>

        <div
            id="statusBadge"
            class="status-badge">
            ...
        </div>

        <div
            id="statusInfo"
            class="status-info">

        </div>

    </section>

        id="message"

    </div>


    <!-- QUICK -->

        </div>

            <select id="durationInput">

                <option value="1">

                </option>

                </option>

                        selected>

                </option>

        <div class="preview">

            <div class="preview-label">

            </div>

            <div
                id="previewTime"

                --
            </div>

        <button
            id="bookButton"
            class="book-button"
            onclick="bookSauna()">

        </button>

    <!-- UPCOMING -->

    <section class="card">

        <div class="section-title">

        </div>

        <div
            id="bookingCount"
            style="
                color:rgba(255,255,255,.5);
                margin-bottom:15px;
            ">
            Hämtar...

            id="bookingList"
            class="booking-list">
        </div>

    </section>


    <div class="footer">

    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
   ========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getFirestore,
    collection,
    query,
    onSnapshot,
    runTransaction,
    doc,
    deleteDoc,
    Timestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDLcidVFvfuuoVNNzv9PAFQl6-qI6vHXW0",

    authDomain:
        "boka-bastu.firebaseapp.com",

    projectId:
        "boka-bastu",

    storageBucket:
        "boka-bastu.firebasestorage.app",

    messagingSenderId:
        "605683023531",

    appId:
        "1:605683023531:web:92edea0e3765726e4d41ee"
};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const auth =
    getAuth(app);


const bookingsRef =
    collection(db, "bookings");


let bookings = [];

let currentUser = null;


/* =========================================================
   HELPERS
   ========================================================= */

function pad(number) {

    return String(number).padStart(2, "0");

}


function dateString(date) {

    return (
        date.getFullYear()
        + "-"
        + pad(date.getMonth() + 1)
        + "-"
        + pad(date.getDate())
    );

}


function timeString(date) {

    return (
        pad(date.getHours())
        + ":"
        + pad(date.getMinutes())
    );

}


function timeToMinutes(time) {

    const parts =
        time.split(":").map(Number);

    return parts[0] * 60 + parts[1];

}


function minutesToTime(minutes) {

    minutes =
        ((minutes % 1440) + 1440) % 1440;

    const h =
        Math.floor(minutes / 60);

    const m =
        minutes % 60;

    return pad(h) + ":" + pad(m);

}


function makeEndTime(date, start, duration) {

    const d =
        new Date(
            date + "T" + start + ":00"
        );

    d.setMinutes(
        d.getMinutes()
        + Number(duration) * 60
    );

    return timeString(d);

}


function bookingEndDateTime(booking) {

    const start =
        new Date(
            booking.date
            + "T"
            + booking.start
            + ":00"
        );

    start.setHours(
        start.getHours()
        + Number(booking.duration)
    );

    return start;

}


function formatDate(dateStringValue) {

    const d =
        new Date(
            dateStringValue + "T12:00:00"
        );

    return d.toLocaleDateString(
        "sv-SE",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

}


function hideMessage() {

    const box =
        document.getElementById("message");

    box.textContent = "";

    box.className =
        "message";

}


/* =========================================================
   FORM
   ========================================================= */

function updatePreview() {

    const date =
        document.getElementById(
            "dateInput"
        ).value;

    const start =
        document.getElementById(
            "timeInput"
        ).value;

    const duration =
        Number(
            document.getElementById(
                "durationInput"
            ).value
        );


    if (!date || !start) {

        document.getElementById(
            "previewTime"
        ).textContent = "--";

        document.getElementById(
            "previewDate"
        ).textContent = "--";

        return;
    }


    const end =
        makeEndTime(
            date,
            start,
            duration
        );


    document.getElementById(
        "previewTime"
    ).textContent =
        start + " → " + end;


    document.getElementById(
        "previewDate"
    ).textContent =
        formatDate(date);

}


document
    .getElementById("dateInput")
    .addEventListener(
        "change",
        updatePreview
    );


document
    .getElementById("timeInput")
    .addEventListener(
        "change",
        updatePreview
    );


document
    .getElementById("durationInput")
    .addEventListener(
        "change",
        updatePreview
    );


/* =========================================================
   QUICK BUTTONS
   ========================================================= */

window.setToday = function() {

    const now = new Date();

    document.getElementById(
        "dateInput"
    ).value =
        dateString(now);

    updatePreview();

};


window.setTodayTime = function() {

    const now = new Date();

    document.getElementById(
        "dateInput"
    ).value =
        dateString(now);


    let minutes =
        now.getHours() * 60
        + now.getMinutes();


    /*
       Runda upp till närmaste
       15 minuter.
    */

    minutes =
        Math.ceil(minutes / 15) * 15;


    if (minutes >= 1440) {
        minutes = 0;
    }


    document.getElementById(
        "timeInput"
    ).value =
        minutesToTime(minutes);


    updatePreview();

};


window.setTomorrow = function() {

    const now = new Date();

    now.setDate(
        now.getDate() + 1
    );

    document.getElementById(
        "dateInput"
    ).value =
        dateString(now);


    document.getElementById(
        "timeInput"
    ).value =
        "18:00";


    updatePreview();

};


/* =========================================================
   RENDER BOOKINGS
   ========================================================= */

function renderBookings() {

    const now =
        new Date();


    /*
       Visa endast framtida
       eller pågående bokningar.
    */

    const active =
        bookings
            .filter(
                booking =>
                    bookingEndDateTime(
                        booking
                    ) > now
            )
            .sort(
                (a, b) => {

                    const da =
                        new Date(
                            a.date
                            + "T"
                            + a.start
                            + ":00"
                        );

                    const dbb =
                        new Date(
                            b.date
                            + "T"
                            + b.start
                            + ":00"
                        );

                    return da - dbb;

                }
            );


    document.getElementById(
        "bookingCount"
    ).textContent =
        active.length
        + (
            active.length === 1
                ? " bokning"
                : " bokningar"
        );


    const list =
        document.getElementById(
            "bookingList"
        );


    if (!active.length) {

        list.innerHTML =
            `<div class="empty">
                Inga kommande bokningar
             </div>`;

        return;
    }


    list.innerHTML =
        active
            .map(
                booking => {

                    const end =
                        makeEndTime(
                            booking.date,
                            booking.start,
                            booking.duration
                        );


                    return `
                        <div class="booking">

                            <div class="booking-date">
                                ${formatDate(booking.date)}
                            </div>

                            <div class="booking-time">
                                ${booking.start}
                                →
                                ${end}
                            </div>

                            <div class="booking-duration">
                                ${booking.duration}
                                ${
                                    Number(
                                        booking.duration
                                    ) === 1
                                    ? "timme"
                                    : "timmar"
                                }
                            </div>

                        </div>
                    `;

                }
            )
            .join("");

}


/* =========================================================
   STATUS
   ========================================================= */

function updateStatus() {

    const now =
        new Date();

    const today =
        dateString(now);

    const nowMinutes =
        now.getHours() * 60
        + now.getMinutes()
        + now.getSeconds() / 60;


    const current =
        bookings.find(
            booking => {

                if (
                    booking.date
                    !== today
                ) {
                    return false;
                }


                const start =
                    timeToMinutes(
                        booking.start
                    );


                const end =
                    start
                    + Number(
                        booking.duration
                    ) * 60;


                return (
                    nowMinutes >= start
                    &&
                    nowMinutes < end
                );

            }
        );


    const title =
        document.getElementById(
            "statusTitle"
        );


    const info =
        document.getElementById(
            "statusInfo"
        );


    const badge =
        document.getElementById(
            "statusBadge"
        );


    if (current) {

        const end =
            makeEndTime(
                current.date,
                current.start,
                current.duration
            );


        title.textContent =
            "Bastun är bokad";


        badge.textContent =
            "BOKAD";


        badge.classList.add(
            "busy"
        );


        info.textContent =
            "Bokad till " + end + ".";

    }

    else {

        title.textContent =
            "Ledig";


        badge.textContent =
            "LEDIG";


        badge.classList.remove(
            "busy"
        );


        /*
           Hitta nästa bokning
        */

        const future =
            bookings
                .filter(
                    b =>
                        bookingEndDateTime(b)
                        > now
                )
                .sort(
                    (a, b) =>
                        bookingEndDateTime(a)
                        -
                        bookingEndDateTime(b)
                );


        if (future.length) {

            info.textContent =
                "Nästa bokning "
                + future[0].date
                + " kl. "
                + future[0].start
                + ".";

        }

        else {

            info.textContent =
                "Bastun är ledig.";

        }

    }

}


/* =========================================================
   DELETE EXPIRED BOOKINGS
   ========================================================= */

async function cleanupExpiredBookings() {

    if (!currentUser) {
        return;
    }


    const now =
        new Date();


    /*
       Ta bort bokningar vars sluttid
       redan har passerat.
    */

    const expired =
        bookings.filter(
            booking =>
                bookingEndDateTime(
                    booking
                ) <= now
        );


    for (const booking of expired) {

        try {

            await deleteDoc(
                doc(
                    db,
                    "bookings",
                    booking.id
                )
            );

        }

        catch (error) {

            /*
               Cloud Function är
               säkerhetsnät om klienten
               inte får radera.
            */

            console.warn(
                "Kunde inte radera gammal bokning:",
                error
            );

        }

    }

}


/* =========================================================
   REALTIME FIRESTORE
   ========================================================= */

function listenForBookings() {

    const q =
        query(bookingsRef);


    onSnapshot(

        q,

        async snapshot => {

            bookings =
                snapshot.docs.map(
                    docSnap => ({

                        id:
                            docSnap.id,

                        ...docSnap.data()

                    })
                );


            renderBookings();

            updateStatus();

            await cleanupExpiredBookings();

        },


        error => {

            console.error(
                "Firestore read error:",
                error
            );


            showMessage(
                "Kunde inte läsa bokningarna: "
                + error.message,
                "error"
            );


            document.getElementById(
                "statusInfo"
            ).textContent =
                "Kunde inte läsa Firebase.";

        }

    );

}


/* =========================================================
   BOOK
   ========================================================= */

window.bookSauna = async function() {

    hideMessage();


    if (!currentUser) {

        showMessage(
            "Firebase-inloggningen är inte klar ännu. Försök igen om en sekund.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "bookButton"
        );


    const date =
        document.getElementById(
            "dateInput"
        ).value;


    const start =
        document.getElementById(
            "timeInput"
        ).value;


    const duration =
        Number(
            document.getElementById(
                "durationInput"
            ).value
        );


    if (!date || !start) {

        showMessage(
            "Välj datum och tid.",
            "error"
        );

        return;
    }


    const startDate =
        new Date(
            date
            + "T"
            + start
            + ":00"
        );


    const endDate =
        new Date(
            startDate
        );


    endDate.setHours(
        endDate.getHours()
        + duration
    );


    if (
        startDate <= new Date()
    ) {

        showMessage(
            "Bokningen måste börja i framtiden.",
            "error"
        );

        return;
    }


    if (
        endDate.getDate()
        !== startDate.getDate()
    ) {

        showMessage(
            "Bokningen måste sluta samma dag.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "Sparar...";


    try {

        await runTransaction(
            db,
            async transaction => {

                /*
                   Hämta alla bokningar.

                   Vi gör kontrollen i transaktionen
                   så samtidiga bokningar får
                   konsekvent resultat.
                */

                const snapshot =
                    await transaction.get(
                        bookingsRef
                    );


                const requestedStart =
                    startDate.getTime();


                const requestedEnd =
                    endDate.getTime();


                for (
                    const docSnap
                    of snapshot.docs
                ) {

                    const existing =
                        docSnap.data();


                    /*
                       Hoppa över gamla bokningar.
                    */

                    if (
                        bookingEndDateTime(
                            existing
                        ) <= new Date()
                    ) {

                        transaction.delete(
                            docSnap.ref
                        );

                        continue;
                    }


                    const existingStart =
                        new Date(
                            existing.date
                            + "T"
                            + existing.start
                            + ":00"
                        );


                    const existingEnd =
                        new Date(
                            existingStart
                        );


                    existingEnd.setHours(
                        existingEnd.getHours()
                        + Number(
                            existing.duration
                        )
                    );


                    const conflict =
                        requestedStart
                        < existingEnd.getTime()
                        &&
                        requestedEnd
                        > existingStart.getTime();


                    if (conflict) {

                        throw new Error(
                            "CONFLICT"
                        );

                    }

                }


                const newBooking =
                    doc(bookingsRef);


                transaction.set(
                    newBooking,
                    {

                        date:
                            date,

                        start:
                            start,

                        duration:
                            duration,

                        uid:
                            currentUser.uid,

                        expiresAt:
                            Timestamp.fromDate(
                                endDate
                            ),

                        createdAt:
                            Timestamp.fromDate(
                                new Date()
                            )

                    }
                );

            }
        );


        showMessage(
            "Bokningen är sparad!",
            "success"
        );


    }

    catch (error) {

        console.error(
            "Firestore write error:",
            error
        );


        if (
            error.message
            === "CONFLICT"
        ) {

            showMessage(
                "Den tiden är redan bokad. Välj en annan tid.",
                "error"
            );

        }

        else {

            showMessage(
                "Kunde inte spara bokningen: "
                + error.message,
                "error"
            );

        }

    }


    button.disabled = false;

    button.textContent =
        "🔥 Boka bastu";

};

const now =
    new Date();


document.getElementById(
    "dateInput"
).value =
    dateString(now);


/*
   Standardtid:
   närmaste halvtimme,
   dock minst 30 minuter framåt.
*/

let initialMinutes =
    now.getHours() * 60
    + now.getMinutes()
    + 30;


initialMinutes =
    Math.ceil(
        initialMinutes / 30
    ) * 30;


if (initialMinutes >= 1440) {

    initialMinutes =
        23 * 60;

}


document.getElementById(
    "timeInput"
).value =
    minutesToTime(
        initialMinutes
    );


updatePreview();

   LIVE CLOCK
   ========================================================= */

/*
   Status och gamla bokningar kontrolleras
   var 5:e sekund.

   Firestore onSnapshot gör själva
   databassynkningen live.
*/

setInterval(
    async () => {

        updateStatus();

        renderBookings();

        await cleanupExpiredBookings();

    },
    5000
);
