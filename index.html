<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>Boka bastun</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
    background: #f4f1eb;
    color: #29251f;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    padding: 18px 16px 28px;
}

.header {
    text-align: center;
    margin-bottom: 16px;
}

.fire {
    font-size: 28px;
    line-height: 1;
    margin-bottom: 5px;
}

h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.4px;
}

.subtitle {
    margin-top: 4px;
    font-size: 13px;
    color: #777067;
}

.status {
    background: #fff;
    border-radius: 16px;
    padding: 13px 15px;
    margin-bottom: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
}

.status-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.status-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #56a45d;
}

.status-dot.busy {
    background: #d46a45;
}

.status-title {
    font-size: 13px;
    color: #777067;
    margin-bottom: 1px;
}

.status-value {
    font-size: 17px;
    font-weight: 700;
}

.status-time {
    font-size: 12px;
    color: #777067;
    text-align: right;
}

.quick {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 13px;
}

.quick button {
    border: 0;
    background: #fff;
    color: #38322b;
    border-radius: 12px;
    padding: 11px 5px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    cursor: pointer;
}

.quick button.active {
    background: #302b25;
    color: #fff;
}

.card {
    background: #fff;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    margin-bottom: 13px;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
    margin-bottom: 11px;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-size: 12px;
    color: #777067;
    margin: 0 0 5px 2px;
}

input,
select {
    width: 100%;
    height: 43px;
    border: 1px solid #ddd7cf;
    border-radius: 10px;
    background: #faf9f7;
    color: #29251f;
    font-size: 16px;
    padding: 0 10px;
    outline: none;
    font-family: inherit;
}

.preview-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .7px;
    color: #8a8178;
    margin: 2px 0 4px;
}

.preview {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}

.book-button {
    width: 100%;
    height: 46px;
    border: 0;
    border-radius: 12px;
    background: #302b25;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.book-button:disabled {
    opacity: .5;
}

.message {
    margin-top: 10px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
}

.message.error {
    color: #b54835;
}

.message.ok {
    color: #4d8f53;
}

.bookings-card {
    background: #fff;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
}

.section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .7px;
    color: #8a8178;
    margin-bottom: 9px;
}

.booking {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid #eee9e3;
}

.booking:first-of-type {
    border-top: 0;
    padding-top: 0;
}

.booking-date {
    font-size: 11px;
    color: #8a8178;
    text-transform: uppercase;
    margin-bottom: 2px;
}

.booking-time {
    font-size: 16px;
    font-weight: 700;
}

.booking-duration {
    font-size: 12px;
    color: #777067;
    margin-top: 2px;
}

.booking-state {
    font-size: 11px;
    font-weight: 600;
    color: #56a45d;
}

.empty {
    font-size: 13px;
    color: #8a8178;
    padding: 2px 0;
}

.footer {
    text-align: center;
    margin-top: 16px;
    font-size: 10px;
    color: #aaa198;
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="fire">🔥</div>
        <h1>Boka bastun</h1>
        <div class="subtitle">Glöm inte att göra fint efter Er</div>
    </div>

    <div class="status">

        <div class="status-left">

            <div id="statusDot" class="status-dot"></div>

            <div>
                <div class="status-title">Status</div>
                <div id="statusValue" class="status-value">
                    Ledig
                </div>
            </div>

        </div>

        <div id="statusTime" class="status-time"></div>

    </div>


    <div class="quick">

        <button id="nowButton">Nu</button>

        <button id="todayButton">Idag</button>

        <button id="tomorrowButton">Imorgon</button>

    </div>


    <div class="card">

        <div class="row">

            <div class="field">

                <label for="date">Datum</label>

                <input
                    id="date"
                    type="date"
                >

            </div>


            <div class="field">

                <label for="time">Start</label>

                <input
                    id="time"
                    type="time"
                >

            </div>

        </div>


        <div class="field" style="margin-bottom:12px;">

            <label for="duration">Längd</label>

            <select id="duration">

                <option value="1">
                    1 timme
                </option>

                <option value="2">
                    2 timmar
                </option>

                <option value="3" selected>
                    3 timmar
                </option>

            </select>

        </div>


        <div class="preview-title">
            DIN BOKNING
        </div>


        <div id="preview" class="preview">
            -
        </div>


        <button
            id="bookButton"
            class="book-button">
            Boka bastu
        </button>


        <div id="message" class="message"></div>

    </div>


    <div class="bookings-card">

        <div class="section-title">
            AKTUELLA BOKNINGAR
        </div>

        <div id="bookingsList">
            <div class="empty">
                Ansluter...
            </div>
        </div>

    </div>


    <div class="footer">
        Boka bastun
    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    Timestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE
   ===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDLcidVFvfuuoVNNzv9PAFQl6-qI6vHXW0",

    authDomain:
        "boka-bastu.firebaseapp.com",

    projectId:
        "boka-bastu",

    storageBucket:
        "boka-bastu.firebasestorage.app",

    messagingSenderId:
        "605683023531",

    appId:
        "1:605683023531:web:92edea0e3765726e4d41ee"
};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const bookingsRef =
    collection(db, "bookings");


/* =====================================================
   ELEMENT
   ===================================================== */

const dateInput =
    document.getElementById("date");

const timeInput =
    document.getElementById("time");

const durationInput =
    document.getElementById("duration");

const preview =
    document.getElementById("preview");

const bookButton =
    document.getElementById("bookButton");

const message =
    document.getElementById("message");

const bookingsList =
    document.getElementById("bookingsList");

const statusValue =
    document.getElementById("statusValue");

const statusTime =
    document.getElementById("statusTime");

const statusDot =
    document.getElementById("statusDot");

const nowButton =
    document.getElementById("nowButton");

const todayButton =
    document.getElementById("todayButton");

const tomorrowButton =
    document.getElementById("tomorrowButton");


/* =====================================================
   DATA
   ===================================================== */

let currentUser = null;

let bookings = [];


/* =====================================================
   HJÄLPFUNKTIONER
   ===================================================== */

function pad(n) {

    return String(n).padStart(2, "0");
}


function localDateString(date = new Date()) {

    return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth() + 1) +
        "-" +
        pad(date.getDate())
    );
}


function localTimeString(date = new Date()) {

    return (
        pad(date.getHours()) +
        ":" +
        pad(date.getMinutes())
    );
}


function roundUp15Minutes(date) {

    const d = new Date(date);

    d.setSeconds(0);
    d.setMilliseconds(0);

    const minutes = d.getMinutes();

    const rounded =
        Math.ceil(minutes / 15) * 15;

    if (rounded >= 60) {

        d.setHours(d.getHours() + 1);
        d.setMinutes(0);

    } else {

        d.setMinutes(rounded);
    }

    return d;
}


function startDate(booking) {

    return new Date(
        booking.date +
        "T" +
        booking.start +
        ":00"
    );
}


function endDate(booking) {

    return new Date(
        startDate(booking).getTime() +
        Number(booking.duration) *
        60 *
        60 *
        1000
    );
}


function formatDate(dateString) {

    const d =
        new Date(
            dateString + "T12:00:00"
        );

    const months = [
        "JAN", "FEB", "MAR",
        "APR", "MAJ", "JUN",
        "JUL", "AUG", "SEP",
        "OKT", "NOV", "DEC"
    ];

    return (
        d.getDate() +
        " " +
        months[d.getMonth()]
    );
}


/* =====================================================
   FORMULÄR
   ===================================================== */

function updatePreview() {

    if (
        !dateInput.value ||
        !timeInput.value
    ) {

        preview.textContent = "-";

        return;
    }


    const start =
        new Date(
            dateInput.value +
            "T" +
            timeInput.value +
            ":00"
        );


    const end =
        new Date(
            start.getTime() +
            Number(durationInput.value) *
            60 *
            60 *
            1000
        );


    preview.textContent =
        formatDate(dateInput.value) +
        " " +
        pad(start.getHours()) +
        ":" +
        pad(start.getMinutes()) +
        " → " +
        pad(end.getHours()) +
        ":" +
        pad(end.getMinutes());
}


function setQuickButton(name) {

    nowButton.classList.toggle(
        "active",
        name === "now"
    );

    todayButton.classList.toggle(
        "active",
        name === "today"
    );

    tomorrowButton.classList.toggle(
        "active",
        name === "tomorrow"
    );
}


function setNow() {

    const now =
        roundUp15Minutes(new Date());

    dateInput.value =
        localDateString(now);

    timeInput.value =
        localTimeString(now);

    setQuickButton("now");

    updatePreview();
}


function setToday() {

    const now =
        new Date();

    dateInput.value =
        localDateString(now);

    setQuickButton("today");

    updatePreview();
}


function setTomorrow() {

    const d =
        new Date();

    d.setDate(
        d.getDate() + 1
    );

    dateInput.value =
        localDateString(d);

    setQuickButton("tomorrow");

    updatePreview();
}


/* =====================================================
   MEDDELANDEN
   ===================================================== */

function showMessage(
    text,
    type = ""
) {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

    const now =
        new Date();


    const current =
        bookings.find(booking => {

            const start =
                startDate(booking);

            const end =
                endDate(booking);

            return (
                now >= start &&
                now < end
            );
        });


    if (current) {

        const end =
            endDate(current);

        statusValue.textContent =
            "Bokad";

        statusDot.classList.add(
            "busy"
        );

        statusTime.textContent =
            "Till " +
            pad(end.getHours()) +
            ":" +
            pad(end.getMinutes());

    } else {

        statusValue.textContent =
            "Ledig";

        statusDot.classList.remove(
            "busy"
        );

        statusTime.textContent =
            "";
    }
}


/* =====================================================
   VISA BOKNINGAR
   ===================================================== */

function renderBookings() {

    const now =
        new Date();


    const visible =
        bookings
            .filter(booking => {

                return endDate(booking) > now;

            })
            .sort((a, b) => {

                return (
                    startDate(a) -
                    startDate(b)
                );

            });


    if (visible.length === 0) {

        bookingsList.innerHTML =
            '<div class="empty">' +
            'Inga aktuella bokningar' +
            '</div>';

        return;
    }


    bookingsList.innerHTML =
        visible.map(booking => {

            const start =
                startDate(booking);

            const end =
                endDate(booking);

            const active =
                now >= start &&
                now < end;


            return `
                <div class="booking">

                    <div>

                        <div class="booking-date">
                            ${formatDate(booking.date)}
                        </div>

                        <div class="booking-time">
                            ${pad(start.getHours())}:${pad(start.getMinutes())}
                            →
                            ${pad(end.getHours())}:${pad(end.getMinutes())}
                        </div>

                        <div class="booking-duration">
                            ${booking.duration}
                            ${Number(booking.duration) === 1
                                ? "timme"
                                : "timmar"}
                        </div>

                    </div>

                    <div class="booking-state">
                        ${active ? "PÅGÅR" : "BOKAD"}
                    </div>

                </div>
            `;

        }).join("");
}


/* =====================================================
   RADERA UTGÅNGNA BOKNINGAR
   ===================================================== */

async function removeExpiredBookings() {

    if (!currentUser) {
        return;
    }


    const now =
        new Date();


    const expired =
        bookings.filter(booking => {

            return endDate(booking) <= now;

        });


    for (const booking of expired) {

        try {

            await deleteDoc(
                doc(
                    db,
                    "bookings",
                    booking.id
                )
            );

        } catch (error) {

            console.log(
                "Utgången bokning kunde inte raderas:",
                error
            );
        }
    }
}


/* =====================================================
   RENDER
   ===================================================== */

function render() {

    updateStatus();

    renderBookings();
}


/* =====================================================
   LIVE FIRESTORE
   ===================================================== */

/*
 * VIKTIGT:
 *
 * Ingen query()
 * Ingen orderBy()
 * Inget index behövs.
 *
 * Vi läser hela collectionen och sorterar
 * bokningarna själva i JavaScript.
 */

function startRealtime() {

    onSnapshot(

        bookingsRef,

        snapshot => {

            bookings =
                snapshot.docs.map(
                    document => ({

                        id: document.id,

                        ...document.data()

                    })
                );


            render();

            removeExpiredBookings();

        },

        error => {

            console.error(
                "Firestore läsfel:",
                error
            );

            showMessage(
                "Kunde inte läsa bokningarna: " +
                error.message,
                "error"
            );
        }
    );
}


/* =====================================================
   BOKA
   ===================================================== */

async function createBooking() {

    if (!currentUser) {

        showMessage(
            "Ansluter till Firebase...",
            "error"
        );

        return;
    }


    if (
        !dateInput.value ||
        !timeInput.value
    ) {

        showMessage(
            "Välj datum och tid.",
            "error"
        );

        return;
    }


    const duration =
        Number(durationInput.value);


    const start =
        new Date(
            dateInput.value +
            "T" +
            timeInput.value +
            ":00"
        );


    const end =
        new Date(
            start.getTime() +
            duration *
            60 *
            60 *
            1000
        );


    if (end <= new Date()) {

        showMessage(
            "Bokningstiden har redan passerat.",
            "error"
        );

        return;
    }


    /*
     * Kontrollera om någon redan bokat tiden.
     */

    const conflict =
        bookings.find(booking => {

            const existingStart =
                startDate(booking);

            const existingEnd =
                endDate(booking);

            return (
                start < existingEnd &&
                end > existingStart
            );
        });


    if (conflict) {

        const s =
            startDate(conflict);

        const e =
            endDate(conflict);

        showMessage(
            "Tiden är redan bokad " +
            pad(s.getHours()) +
            ":" +
            pad(s.getMinutes()) +
            "–" +
            pad(e.getHours()) +
            ":" +
            pad(e.getMinutes()),
            "error"
        );

        return;
    }


    bookButton.disabled = true;

    bookButton.textContent =
        "Bokar...";


    try {

        await addDoc(
            bookingsRef,
            {

                date:
                    dateInput.value,

                start:
                    timeInput.value,

                duration:
                    duration,

                uid:
                    currentUser.uid,

                createdAt:
                    Timestamp.now(),

                expiresAt:
                    Timestamp.fromDate(end)
            }
        );


        showMessage(
            "Bastun är bokad!",
            "ok"
        );


        /*
         * onSnapshot kommer nu automatiskt
         * att lägga in bokningen i listan.
         */


    } catch (error) {

        console.error(
            "Bokningsfel:",
            error
        );

        showMessage(
            "Kunde inte spara bokningen: " +
            error.message,
            "error"
        );

    } finally {

        bookButton.disabled = false;

        bookButton.textContent =
            "Boka bastu";
    }
}


/* =====================================================
   KNAPPAR
   ===================================================== */

nowButton.addEventListener(
    "click",
    setNow
);

todayButton.addEventListener(
    "click",
    setToday
);

tomorrowButton.addEventListener(
    "click",
    setTomorrow
);

dateInput.addEventListener(
    "change",
    () => {

        setQuickButton("");

        updatePreview();
    }
);

timeInput.addEventListener(
    "change",
    updatePreview
);

durationInput.addEventListener(
    "change",
    updatePreview
);

bookButton.addEventListener(
    "click",
    createBooking
);


/* =====================================================
   START
   ===================================================== */

setNow();


/* =====================================================
   FIREBASE LOGIN
   ===================================================== */

signInAnonymously(auth)
    .catch(error => {

        console.error(
            "Firebase auth-fel:",
            error
        );

        showMessage(
            "Kunde inte ansluta till Firebase: " +
            error.message,
            "error"
        );
    });


onAuthStateChanged(
    auth,
    user => {

        currentUser = user;

        if (user) {

            startRealtime();

        }
    }
);


/* =====================================================
   LIVE KLOCKA
   ===================================================== */

setInterval(
    () => {

        render();

        removeExpiredBookings();

    },
    5000
);

</script>

</body>
</html>
