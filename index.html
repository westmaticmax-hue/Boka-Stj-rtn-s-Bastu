<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>Boka bastun</title>

<style>

/* =====================================================
   GRUND
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #f8f3ec 0%,
            #eee5d9 100%
        );

    color: #2d2925;

    -webkit-font-smoothing: antialiased;
}

button,
input,
select {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

.app {
    width: 100%;
    max-width: 440px;

    min-height: 100vh;

    margin: 0 auto;

    padding:
        max(18px, env(safe-area-inset-top))
        16px
        calc(28px + env(safe-area-inset-bottom));
}


/* =====================================================
   HEADER
   ===================================================== */

.header {
    text-align: center;

    padding:
        5px 0 18px;
}

.fire {
    font-size: 38px;

    line-height: 1;

    margin-bottom: 7px;

    filter:
        drop-shadow(
            0 3px 5px rgba(0,0,0,.12)
        );
}

h1 {
    margin: 0;

    font-size: 30px;

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: -1px;
}

.subtitle {
    margin-top: 7px;

    font-size: 15px;

    line-height: 1.3;

    color: #827970;
}


/* =====================================================
   STATUSKORT
   ===================================================== */

.status {
    position: relative;

    overflow: hidden;

    min-height: 112px;

    padding: 18px 19px;

    margin-bottom: 12px;

    border-radius: 22px;

    background:
        rgba(255,255,255,.94);

    border:
        1px solid rgba(255,255,255,.95);

    box-shadow:
        0 5px 18px rgba(72,55,40,.09);
}


/*
 * Liten dekorativ varm cirkel.
 */

.status::after {
    content: "";

    position: absolute;

    width: 155px;
    height: 155px;

    right: -70px;
    top: -75px;

    border-radius: 50%;

    background:
        rgba(222,155,94,.10);

    pointer-events: none;
}


.status-content {
    position: relative;

    z-index: 1;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;
}


.status-left {
    display: flex;

    align-items: center;

    gap: 13px;
}


.status-dot {
    width: 14px;
    height: 14px;

    flex: 0 0 auto;

    border-radius: 50%;

    background: #64a768;

    box-shadow:
        0 0 0 5px rgba(100,167,104,.12);
}

.status-dot.busy {
    background: #d06b48;

    box-shadow:
        0 0 0 5px rgba(208,107,72,.12);
}


.status-label {
    font-size: 12px;

    font-weight: 700;

    letter-spacing: 1px;

    text-transform: uppercase;

    color: #8b8178;

    margin-bottom: 3px;
}


.status-value {
    font-size: 27px;

    line-height: 1;

    font-weight: 800;

    letter-spacing: -0.7px;
}


/*
 * Tiden får en egen tydlig yta.
 */

.status-end {
    position: relative;

    z-index: 1;

    min-width: 105px;

    padding:
        9px 12px;

    border-radius: 14px;

    background: #f7f3ee;

    text-align: center;
}


.status-end-label {
    font-size: 10px;

    font-weight: 800;

    letter-spacing: .8px;

    text-transform: uppercase;

    color: #8c8178;

    margin-bottom: 2px;
}


.status-end-time {
    font-size: 22px;

    line-height: 1.05;

    font-weight: 800;

    letter-spacing: -.4px;

    color: #342e29;
}


/* =====================================================
   SNABBVAL
   ===================================================== */

.quick {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;

    margin-bottom: 12px;
}

.quick button {
    min-height: 52px;

    border: 0;

    border-radius: 16px;

    background:
        rgba(255,255,255,.94);

    color: #39332e;

    font-size: 16px;

    font-weight: 750;

    box-shadow:
        0 3px 11px rgba(72,55,40,.07);

    cursor: pointer;

    transition:
        transform .12s ease,
        background .12s ease,
        box-shadow .12s ease;
}

.quick button:active {
    transform: scale(.97);
}

.quick button.active {
    background: #342e29;

    color: #fff;

    box-shadow:
        0 5px 13px rgba(52,46,41,.18);
}


/* =====================================================
   BOKNINGSKORT
   ===================================================== */

.card {
    padding: 18px;

    margin-bottom: 12px;

    border-radius: 22px;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid rgba(255,255,255,.95);

    box-shadow:
        0 5px 18px rgba(72,55,40,.09);
}


/* =====================================================
   DATUM / START
   ===================================================== */

.row {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-bottom: 13px;
}


.field {
    display: flex;

    flex-direction: column;
}


label {
    font-size: 14px;

    font-weight: 650;

    color: #756c64;

    margin:
        0 0 6px 2px;
}


input,
select {
    width: 100%;

    height: 51px;

    border:
        1px solid #ddd6ce;

    border-radius: 14px;

    background: #fbfaf8;

    color: #2d2925;

    font-size: 17px;

    padding:
        0 12px;

    outline: none;

    appearance: auto;
}


input:focus,
select:focus {
    border-color: #b7aaa0;

    box-shadow:
        0 0 0 3px rgba(183,170,160,.12);
}


/* =====================================================
   DIN BOKNING
   ===================================================== */

.preview-box {
    margin-top: 17px;

    margin-bottom: 15px;

    padding:
        12px 14px;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #f8f3ed,
            #f1e9df
        );
}


.preview-title {
    font-size: 11px;

    font-weight: 800;

    letter-spacing: 1.2px;

    text-transform: uppercase;

    color: #897f76;

    margin-bottom: 5px;
}


.preview {
    font-size: 25px;

    line-height: 1.15;

    font-weight: 800;

    letter-spacing: -.7px;
}


/* =====================================================
   BOKA-KNAPP
   ===================================================== */

.book-button {
    width: 100%;

    min-height: 56px;

    border: 0;

    border-radius: 16px;

    background: #342e29;

    color: #fff;

    font-size: 18px;

    font-weight: 800;

    letter-spacing: -.2px;

    box-shadow:
        0 6px 15px rgba(52,46,41,.19);

    cursor: pointer;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.book-button:active {
    transform: scale(.985);
}

.book-button:disabled {
    opacity: .55;
}


/* =====================================================
   MEDDELANDE
   ===================================================== */

.message {
    min-height: 21px;

    margin-top: 10px;

    text-align: center;

    font-size: 15px;

    line-height: 1.35;
}

.message.error {
    color: #b6503a;
}

.message.ok {
    color: #5b9560;
}


/* =====================================================
   AKTUELLA BOKNINGAR
   ===================================================== */

.bookings-card {
    padding: 18px;

    border-radius: 22px;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid rgba(255,255,255,.95);

    box-shadow:
        0 5px 18px rgba(72,55,40,.09);
}


.section-heading {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 9px;
}


.section-title {
    font-size: 12px;

    font-weight: 800;

    letter-spacing: 1.2px;

    text-transform: uppercase;

    color: #8a8077;
}


.booking-count {
    font-size: 12px;

    font-weight: 700;

    color: #a0958b;
}


.booking {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    padding:
        13px 0;

    border-top:
        1px solid #eee9e3;
}

.booking:first-of-type {
    border-top: 0;

    padding-top: 2px;
}


.booking-date {
    font-size: 12px;

    font-weight: 750;

    color: #91877e;

    margin-bottom: 3px;
}


.booking-time {
    font-size: 20px;

    line-height: 1.1;

    font-weight: 800;

    letter-spacing: -.35px;
}


.booking-duration {
    font-size: 14px;

    color: #81776f;

    margin-top: 4px;
}


.booking-state {
    flex-shrink: 0;

    padding:
        6px 9px;

    border-radius: 10px;

    background: #f0f7ef;

    color: #5e9861;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: .5px;
}


.empty {
    font-size: 15px;

    color: #8c8279;

    padding: 3px 0;
}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {
    text-align: center;

    margin-top: 18px;

    font-size: 11px;

    color: #aaa097;
}


/* =====================================================
   SMÅ MOBILER
   ===================================================== */

@media (max-width: 360px) {

    .app {
        padding-left: 12px;
        padding-right: 12px;
    }

    h1 {
        font-size: 27px;
    }

    .status {
        padding: 16px;
    }

    .status-end {
        min-width: 94px;
        padding: 8px 9px;
    }

    .status-end-time {
        font-size: 20px;
    }

    .status-value {
        font-size: 24px;
    }

    .preview {
        font-size: 22px;
    }

    .booking-time {
        font-size: 18px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="header">

        <div class="fire">
            🔥
        </div>

        <h1>
            Boka bastun
        </h1>

        <div class="subtitle">
            Glöm inte att göra fint efter Er
        </div>

    </div>


    <!-- =================================================
         STATUS

    <div class="status">

        <div class="status-content">

                    id="statusDot"

                </div>

                    id="date"

        <div id="bookingsList">

            <div class="empty">
                Ansluter...
            </div>

        </div>

    </div>


    <div class="footer">

    </div>


</div>


<script type="module">


/* =====================================================
   FIREBASE
   ===================================================== */

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    Timestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDLcidVFvfuuoVNNzv9PAFQl6-qI6vHXW0",

    authDomain:
        "boka-bastu.firebaseapp.com",

    projectId:
        "boka-bastu",

    storageBucket:
        "boka-bastu.firebasestorage.app",

    messagingSenderId:
        "605683023531",

    appId:
        "1:605683023531:web:92edea0e3765726e4d41ee"
};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const bookingsRef =
    collection(
        db,
        "bookings"
    );


/* =====================================================
   ELEMENT
   ===================================================== */

const dateInput =
    document.getElementById(
        "date"
    );

const timeInput =
    document.getElementById(
        "time"
    );

const durationInput =
    document.getElementById(
        "duration"
    );

const preview =
    document.getElementById(
        "preview"
    );

const bookButton =
    document.getElementById(
        "bookButton"
    );

const message =
    document.getElementById(
        "message"
    );

const bookingsList =
    document.getElementById(
        "bookingsList"
    );

const bookingCount =
    document.getElementById(
        "bookingCount"
    );

const statusValue =
    document.getElementById(
        "statusValue"
    );

const statusTime =
    document.getElementById(
        "statusTime"
    );

const statusEnd =
    document.getElementById(
        "statusEnd"
    );

const statusDot =
    document.getElementById(
        "statusDot"
    );

const nowButton =
    document.getElementById(
        "nowButton"
    );

const todayButton =
    document.getElementById(
        "todayButton"
    );

const tomorrowButton =
    document.getElementById(
        "tomorrowButton"
    );


/* =====================================================
   DATA
   ===================================================== */

let currentUser = null;

let bookings = [];


/* =====================================================
   DATUM / TID
   ===================================================== */

function pad(number) {

    return String(number)
        .padStart(2, "0");
}


function localDateString(
    date = new Date()
) {

    return (
        date.getFullYear() +
        "-" +
        pad(
            date.getMonth() + 1
        ) +
        "-" +
        pad(
            date.getDate()
        )
    );
}


function localTimeString(
    date = new Date()
) {

    return (
        pad(
            date.getHours()
        ) +
        ":" +
        pad(
            date.getMinutes()
        )
    );
}


function roundUp15Minutes(
    date
) {

    const d =
        new Date(date);

    d.setSeconds(0);

    d.setMilliseconds(0);

    const minutes =
        d.getMinutes();

    const rounded =
        Math.ceil(
            minutes / 15
        ) * 15;


    if (rounded >= 60) {

        d.setHours(
            d.getHours() + 1
        );

        d.setMinutes(0);

    } else {

        d.setMinutes(
            rounded
        );
    }


    return d;
}


function startDate(
    booking
) {

    return new Date(
        booking.date +
        "T" +
        booking.start +
        ":00"
    );
}


function endDate(
    booking
) {

    return new Date(
        startDate(booking)
            .getTime() +

        Number(
            booking.duration
        ) *
        60 *
        60 *
        1000
    );
}


function formatDate(
    dateString
) {

    const d =
        new Date(
            dateString +
            "T12:00:00"
        );


    const months = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAJ",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OKT",
        "NOV",
        "DEC"
    ];


    return (
        d.getDate() +
        " " +
        months[
            d.getMonth()
        ]
    );
}


/* =====================================================
   FÖRHANDSVISNING
   ===================================================== */

function updatePreview() {

    if (
        !dateInput.value ||
        !timeInput.value
    ) {

        preview.textContent =
            "-";

        return;
    }


    const start =
        new Date(
            dateInput.value +
            "T" +
            timeInput.value +
            ":00"
        );


    const end =
        new Date(
            start.getTime() +
            Number(
                durationInput.value
            ) *
            60 *
            60 *
            1000
        );


    preview.textContent =
        formatDate(
            dateInput.value
        ) +
        " " +
        pad(
            start.getHours()
        ) +
        ":" +
        pad(
            start.getMinutes()
        ) +
        " → " +
        pad(
            end.getHours()
        ) +
        ":" +
        pad(
            end.getMinutes()
        );
}


/* =====================================================
   SNABBKNAPPAR
   ===================================================== */

function setQuickButton(
    name
) {

    nowButton.classList.toggle(
        "active",
        name === "now"
    );

    todayButton.classList.toggle(
        "active",
        name === "today"
    );

    tomorrowButton.classList.toggle(
        "active",
        name === "tomorrow"
    );
}


function setNow() {

    const now =
        roundUp15Minutes(
            new Date()
        );


    dateInput.value =
        localDateString(now);


    timeInput.value =
        localTimeString(now);


    setQuickButton("now");

    updatePreview();
}


function setToday() {

    const now =
        new Date();


    dateInput.value =
        localDateString(now);


    setQuickButton("today");

    updatePreview();
}


function setTomorrow() {

    const tomorrow =
        new Date();


    tomorrow.setDate(
        tomorrow.getDate() + 1
    );


    dateInput.value =
        localDateString(
            tomorrow
        );


    setQuickButton(
        "tomorrow"
    );

    updatePreview();
}


/* =====================================================
   MEDDELANDE
   ===================================================== */

function showMessage(
    text,
    type = ""
) {

    message.textContent =
        text;

    message.className =
        "message " + type;
}


/* =====================================================
   STATUS
   ===================================================== */

function updateStatus() {

    const now =
        new Date();


    const current =
        bookings.find(
            booking => {

                const start =
                    startDate(
                        booking
                    );

                const end =
                    endDate(
                        booking
                    );


                return (
                    now >= start &&
                    now < end
                );
            }
        );


    if (current) {

        const end =
            endDate(
                current
            );


        statusValue.textContent =
            "Bokad";


        statusDot.classList.add(
            "busy"
        );


        statusEnd.style.display =
            "block";


        statusTime.textContent =
            pad(
                end.getHours()
            ) +
            ":" +
            pad(
                end.getMinutes()
            );


    } else {

        statusValue.textContent =
            "Ledig";


        statusDot.classList.remove(
            "busy"
        );


        statusEnd.style.display =
            "none";


        statusTime.textContent =
            "";
    }
}


/* =====================================================
   VISA BOKNINGAR
   ===================================================== */

function renderBookings() {

    const now =
        new Date();


    const visible =
        bookings
            .filter(
                booking =>
                    endDate(
                        booking
                    ) > now
            )
            .sort(
                (a, b) =>
                    startDate(a) -
                    startDate(b)
            );


    bookingCount.textContent =
        visible.length === 0
        ? ""
        : visible.length +
          (
              visible.length === 1
              ? " bokning"
              : " bokningar"
          );


    if (
        visible.length === 0
    ) {

        bookingsList.innerHTML =
            '<div class="empty">' +
            'Inga aktuella bokningar' +
            '</div>';

        return;
    }


    bookingsList.innerHTML =
        visible
            .map(
                booking => {

                    const start =
                        startDate(
                            booking
                        );

                    const end =
                        endDate(
                            booking
                        );


                    const active =
                        now >= start &&
                        now < end;


                    return `

                        <div class="booking">

                            <div>

                                <div class="booking-date">
                                    ${formatDate(
                                        booking.date
                                    )}
                                </div>

                                <div class="booking-time">
                                    ${pad(
                                        start.getHours()
                                    )}:${pad(
                                        start.getMinutes()
                                    )}
                                    →
                                    ${pad(
                                        end.getHours()
                                    )}:${pad(
                                        end.getMinutes()
                                    )}
                                </div>

                                <div class="booking-duration">
                                    ${booking.duration}
                                    ${
                                        Number(
                                            booking.duration
                                        ) === 1
                                        ? "timme"
                                        : "timmar"
                                    }
                                </div>

                            </div>


                            <div class="booking-state">

                                ${
                                    active
                                    ? "PÅGÅR"
                                    : "BOKAD"
                                }

                            </div>

                        </div>

                    `;
                }
            )
            .join("");
}


/* =====================================================
   RADERA UTGÅNGNA BOKNINGAR
   ===================================================== */

async function removeExpiredBookings() {

    if (!currentUser) {
        return;
    }


    const now =
        new Date();


    const expired =
        bookings.filter(
            booking =>
                endDate(
                    booking
                ) <= now
        );


    for (
        const booking
        of expired
    ) {

        try {

            await deleteDoc(
                doc(
                    db,
                    "bookings",
                    booking.id
                )
            );

        } catch (error) {

            console.log(
                "Kunde inte radera utgången bokning:",
                error
            );
        }
    }
}


/* =====================================================
   LIVE FIRESTORE
   ===================================================== */

function startRealtime() {

    onSnapshot(

        bookingsRef,

        snapshot => {

            bookings =
                snapshot.docs.map(
                    document => ({

                        id:
                            document.id,

                        ...document.data()

                    })
                );


            updateStatus();

            renderBookings();

            removeExpiredBookings();

        },

        error => {

            console.error(
                "Firestore:",
                error
            );


            showMessage(
                "Kunde inte läsa bokningarna: " +
                error.message,
                "error"
            );
        }
    );
}


/* =====================================================
   SKAPA BOKNING
   ===================================================== */

async function createBooking() {

    if (!currentUser) {

        showMessage(
            "Ansluter till Firebase...",
            "error"
        );

        return;
    }


    if (
        !dateInput.value ||
        !timeInput.value
    ) {

        showMessage(
            "Välj datum och starttid.",
            "error"
        );

        return;
    }


    const duration =
        Number(
            durationInput.value
        );


    const start =
        new Date(
            dateInput.value +
            "T" +
            timeInput.value +
            ":00"
        );


    const end =
        new Date(
            start.getTime() +
            duration *
            60 *
            60 *
            1000
        );


    if (
        end <= new Date()
    ) {

        showMessage(
            "Bokningstiden har redan passerat.",
            "error"
        );

        return;
    }


    const conflict =
        bookings.find(
            booking => {

                const existingStart =
                    startDate(
                        booking
                    );

                const existingEnd =
                    endDate(
                        booking
                    );


                return (
                    start <
                    existingEnd
                    &&
                    end >
                    existingStart
                );
            }
        );


    if (conflict) {

        const s =
            startDate(
                conflict
            );

        const e =
            endDate(
                conflict
            );


        showMessage(
            "Tiden är redan bokad " +
            pad(
                s.getHours()
            ) +
            ":" +
            pad(
                s.getMinutes()
            ) +
            "–" +
            pad(
                e.getHours()
            ) +
            ":" +
            pad(
                e.getMinutes()
            ),
            "error"
        );


        return;
    }


    bookButton.disabled =
        true;


    bookButton.textContent =
        "Bokar...";


    try {

        await addDoc(
            bookingsRef,
            {

                date:
                    dateInput.value,

                start:
                    timeInput.value,

                duration:
                    duration,

                uid:
                    currentUser.uid,

                createdAt:
                    Timestamp.now(),

                expiresAt:
                    Timestamp.fromDate(
                        end
                    )

            }
        );


        showMessage(
            "Bastun är bokad!",
            "ok"
        );


    } catch (error) {

        console.error(
            "Bokningsfel:",
            error
        );


        showMessage(
            "Kunde inte spara bokningen: " +
            error.message,
            "error"
        );


    } finally {

        bookButton.disabled =
            false;

        bookButton.textContent =
            "Boka bastu";
    }
}


/* =====================================================
   KNAPPAR
   ===================================================== */

nowButton.addEventListener(
    "click",
    setNow
);


todayButton.addEventListener(
    "click",
    setToday
);


tomorrowButton.addEventListener(
    "click",
    setTomorrow
);


dateInput.addEventListener(
    "change",
    () => {

        setQuickButton("");

        updatePreview();
    }
);


timeInput.addEventListener(
    "change",
    updatePreview
);


durationInput.addEventListener(
    "change",
    updatePreview
);


bookButton.addEventListener(
    "click",
    createBooking
);


/* =====================================================
   START
   ===================================================== */

/*
 * 1 timme är alltid standard.
 */

durationInput.value =
    "1";


setNow();


/* =====================================================
   FIREBASE AUTH
   ===================================================== */

signInAnonymously(
    auth
)
.catch(
    error => {

        console.error(
            "Firebase auth:",
            error
        );


        showMessage(
            "Kunde inte ansluta till Firebase: " +
            error.message,
            "error"
        );
    }
);


onAuthStateChanged(
    auth,
    user => {

        currentUser =
            user;


        if (user) {

            startRealtime();

        }
    }
);


/* =====================================================
   AUTOMATISK STATUS
   ===================================================== */

setInterval(
    () => {

        updateStatus();

        renderBookings();

        removeExpiredBookings();

    },
    5000
);

</script>
