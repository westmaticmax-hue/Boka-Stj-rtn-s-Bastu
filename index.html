<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      viewport-fit=cover">

<meta name="theme-color" content="#17110d">

<title>Boka bastun</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #17110d;
    --bg2: #211710;
    --card: rgba(255,255,255,0.065);
    --card-border: rgba(255,255,255,0.10);
    --text: #fff8ef;
    --muted: #b9aaa0;
    --orange: #ff9d45;
    --orange2: #ff6b35;
    --green: #72d39a;
    --red: #ff7568;
}

html,
body {
    margin: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at 50% -10%, #4a2918 0%, transparent 45%),
        linear-gradient(180deg, var(--bg2), var(--bg));
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
}

body {
    padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(28px, env(safe-area-inset-bottom))
        16px;
}

.app {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 4px 22px;
}

.fire {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,157,69,.24),
            rgba(255,107,53,.08)
        );

    border: 1px solid rgba(255,157,69,.22);

    font-size: 27px;

    box-shadow:
        0 8px 30px rgba(255,107,53,.12);
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 750;
    letter-spacing: -0.6px;
}

.header p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 13px;
}

/* CARD */

.card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.22);

    margin-bottom: 15px;
}

/* STATUS */

.status {
    padding: 20px;
    position: relative;
    overflow: hidden;
}

.status::after {
    content: "";
    position: absolute;

    width: 150px;
    height: 150px;

    right: -65px;
    top: -65px;

    border-radius: 50%;

    background: rgba(255,157,69,.08);
}

.status-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.3px;
}

.status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 8px;
}

.status-title {
    font-size: 30px;
    font-weight: 780;
    letter-spacing: -1px;
}

.badge {
    padding: 7px 11px;
    border-radius: 20px;

    font-size: 11px;
    font-weight: 800;
    letter-spacing: .5px;
}

.badge.free {
    background: rgba(114,211,154,.12);
    color: var(--green);
    border: 1px solid rgba(114,211,154,.18);
}

.badge.busy {
    background: rgba(255,117,104,.12);
    color: var(--red);
    border: 1px solid rgba(255,117,104,.18);
}

.status-info {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
}

/* QUICK BUTTONS */

.quick {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;

    padding: 7px;
}

.quick button {
    appearance: none;
    border: 0;

    padding: 12px 6px;

    border-radius: 16px;

    background: transparent;
    color: var(--muted);

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.quick button.active {
    background: rgba(255,255,255,.09);
    color: var(--text);

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.07);
}

/* FORM */

.form {
    padding: 20px;
}

.field {
    margin-bottom: 16px;
}

.field:last-child {
    margin-bottom: 0;
}

.field label {
    display: block;

    margin-bottom: 7px;

    color: var(--muted);

    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
}

select,
input[type="date"],
input[type="time"] {
    width: 100%;

    height: 50px;

    border: 1px solid rgba(255,255,255,.10);
    border-radius: 15px;

    background: rgba(255,255,255,.06);

    color: var(--text);

    padding: 0 14px;

    font-size: 16px;
    font-weight: 600;

    outline: none;
}

select:focus,
input:focus {
    border-color: rgba(255,157,69,.5);
}

select option {
    background: #211710;
    color: white;
}

.time-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* PREVIEW */

.preview {
    margin-top: 18px;

    padding: 15px;

    border-radius: 17px;

    background: rgba(255,157,69,.07);

    border: 1px solid rgba(255,157,69,.12);
}

.preview-label {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .8px;
}

.preview-time {
    margin-top: 4px;

    font-size: 19px;
    font-weight: 750;
}

.preview-date {
    margin-top: 2px;

    color: var(--muted);
    font-size: 12px;
}

/* BOOK BUTTON */

.book-button {
    width: 100%;

    margin-top: 16px;

    min-height: 55px;

    border: 0;
    border-radius: 17px;

    background:
        linear-gradient(
            135deg,
            var(--orange),
            var(--orange2)
        );

    color: #211208;

    font-size: 16px;
    font-weight: 850;

    box-shadow:
        0 10px 25px rgba(255,107,53,.20);

    cursor: pointer;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.book-button:active {
    transform: scale(.98);
}

.book-button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

/* BOOKINGS */

.bookings {
    padding: 20px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 14px;
}

.section-title strong {
    font-size: 14px;
    letter-spacing: .5px;
}

.section-title span {
    color: var(--muted);
    font-size: 11px;
}

.booking {
    display: flex;
    align-items: center;

    gap: 13px;

    padding: 14px 0;

    border-top: 1px solid rgba(255,255,255,.07);
}

.booking:first-child {
    border-top: 0;
}

.booking-date {
    width: 48px;
    flex: 0 0 48px;

    text-align: center;
}

.booking-date .day {
    display: block;

    font-size: 20px;
    font-weight: 800;
}

.booking-date .month {
    display: block;

    margin-top: -2px;

    color: var(--orange);

    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
}

.booking-main {
    flex: 1;
}

.booking-time {
    font-size: 16px;
    font-weight: 750;
}

.booking-meta {
    margin-top: 3px;

    color: var(--muted);

    font-size: 12px;
}

.booking-duration {
    color: var(--muted);
    font-size: 12px;
}

/* EMPTY */

.empty {
    padding: 20px 5px;

    color: var(--muted);

    text-align: center;

    font-size: 13px;
}

/* MESSAGE */

.message {
    display: none;

    margin-bottom: 15px;

    padding: 14px 16px;

    border-radius: 16px;

    font-size: 13px;
    font-weight: 650;
}

.message.show {
    display: block;
}

.message.error {
    background: rgba(255,117,104,.10);
    color: #ff9b91;
    border: 1px solid rgba(255,117,104,.15);
}

.message.success {
    background: rgba(114,211,154,.10);
    color: #8ee0ac;
    border: 1px solid rgba(114,211,154,.15);
}

/* FOOTER */

.footer {
    text-align: center;

    color: rgba(255,255,255,.28);

    font-size: 10px;

    padding: 10px 0 4px;
}

/* MOBILE */

@media (max-width: 380px) {

    .status-title {
        font-size: 27px;
    }

    .header h1 {
        font-size: 23px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="fire">🔥</div>

        <div>
            <h1>Boka bastun</h1>
            <p>Lämna städat och fint efter Er.</p>
        </div>

    </header>


    <!-- STATUS -->

    <section class="card status">

        <div class="status-label">
            STATUS JUST NU
        </div>

        <div class="status-row">

            <div
                id="statusTitle"
                class="status-title">
                Ledig
            </div>

            <div
                id="statusBadge"
                class="badge free">
                LEDIG
            </div>

        </div>

        <div
            id="statusInfo"
            class="status-info">
            Bastun är ledig.
        </div>

    </section>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- QUICK -->

    <section class="card quick">

        <button
            id="nowButton"
            onclick="selectQuick('now')">
            Nu
        </button>

        <button
            id="todayButton"
            onclick="selectQuick('today')">
            Idag
        </button>

        <button
            id="tomorrowButton"
            onclick="selectQuick('tomorrow')">
            Imorgon
        </button>

    </section>


    <!-- BOOKING FORM -->

    <section class="card form">

        <div class="field">

            <label for="date">
                DATUM
            </label>

            <input
                id="date"
                type="date"
                onchange="updatePreview()">

        </div>


        <div class="field">

            <label>
                TID
            </label>

            <div class="time-grid">

                <input
                    id="startTime"
                    type="time"
                    onchange="updatePreview()">

                <select
                    id="duration"
                    onchange="updatePreview()">

                    <option value="1">
                        1 timme
                    </option>

                    <option value="2">
                        2 timmar
                    </option>

                    <option value="3"
                            selected>
                        3 timmar
                    </option>

                </select>

            </div>

        </div>


        <!-- PREVIEW -->

        <div class="preview">

            <div class="preview-label">
                DIN BOKNING
            </div>

            <div
                id="previewTime"
                class="preview-time">
                18:00 → 21:00
            </div>

            <div
                id="previewDate"
                class="preview-date">
                4 september 2026
            </div>

        </div>


        <!-- BUTTON -->

        <button
            id="bookButton"
            class="book-button"
            onclick="bookSauna()">

            🔥 Boka bastu

        </button>

    </section>


    <!-- BOOKINGS -->

    <section class="card bookings">

        <div class="section-title">

            <strong>
                KOMMANDE BOKNINGAR
            </strong>

            <span id="bookingCount">
                0 bokningar
            </span>

        </div>

        <div id="bookingList"></div>

    </section>


    <div class="footer">
        Bastubokning · 2026
    </div>

</div>


<script>

/*
==========================================================
 DEMODATA
 ---------------------------------------------------------
 Detta är bara tillfälliga bokningar.

 När Firebase kopplas in ersätter vi detta med:

 Firestore → collection("bookings")

 Då ser alla användare samma bokningar.
==========================================================
*/

let bookings = [

    {
        id: 1,
        date: "2026-09-04",
        start: "18:00",
        duration: 3
    },

    {
        id: 2,
        date: "2026-09-05",
        start: "10:00",
        duration: 2
    },

    {
        id: 3,
        date: "2026-09-06",
        start: "17:30",
        duration: 1
    }

];


/*
==========================================================
 HJÄLPFUNKTIONER
==========================================================
*/

function todayString() {

    const now = new Date();

    const y = now.getFullYear();

    const m = String(
        now.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        now.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function datePlusDays(days) {

    const date = new Date();

    date.setDate(
        date.getDate() + days
    );

    const y = date.getFullYear();

    const m = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        date.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function timeToMinutes(time) {

    const parts = time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );
}


function minutesToTime(minutes) {

    minutes = minutes % (24 * 60);

    const h = Math.floor(
        minutes / 60
    );

    const m = minutes % 60;

    return (
        String(h).padStart(2, "0") +
        ":" +
        String(m).padStart(2, "0")
    );
}


function formatDate(dateString) {

    const date = new Date(
        dateString + "T12:00:00"
    );

    return date.toLocaleDateString(
        "sv-SE",
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}


function monthShort(dateString) {

    const date = new Date(
        dateString + "T12:00:00"
    );

    return date
        .toLocaleDateString(
            "sv-SE",
            { month: "short" }
        )
        .replace(".", "")
        .toUpperCase();
}


function dayNumber(dateString) {

    const date = new Date(
        dateString + "T12:00:00"
    );

    return date.getDate();
}


/*
==========================================================
 STATUS
==========================================================
*/

function updateStatus() {

    const now = new Date();

    const currentDate =
        todayString();

    const currentMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    let activeBooking = null;

    for (const booking of bookings) {

        if (
            booking.date !==
            currentDate
        ) {
            continue;
        }

        const start =
            timeToMinutes(
                booking.start
            );

        const end =
            start +
            booking.duration * 60;


        if (
            currentMinutes >= start &&
            currentMinutes < end
        ) {

            activeBooking =
                booking;

            break;
        }
    }


    const title =
        document.getElementById(
            "statusTitle"
        );

    const badge =
        document.getElementById(
            "statusBadge"
        );

    const info =
        document.getElementById(
            "statusInfo"
        );


    if (activeBooking) {

        const end =
            timeToMinutes(
                activeBooking.start
            ) +
            activeBooking.duration * 60;

        const endTime =
            minutesToTime(end);


        title.textContent =
            "Bastun är bokad";

        badge.textContent =
            "BOKAD";

        badge.className =
            "badge busy";

        info.textContent =
            `Bokad till ${endTime}.`;

    } else {

        title.textContent =
            "Ledig";

        badge.textContent =
            "LEDIG";

        badge.className =
            "badge free";

        const next =
            findNextBooking();

        if (next) {

            info.textContent =
                `Nästa bokning ${formatDate(next.date)} kl. ${next.start}.`;

        } else {

            info.textContent =
                "Bastun är ledig.";

        }

    }
}


/*
==========================================================
 NÄSTA BOKNING
==========================================================
*/

function findNextBooking() {

    const now = new Date();

    const currentTimestamp =
        now.getTime();

    let closest = null;

    for (const booking of bookings) {

        const date =
            new Date(
                booking.date +
                "T" +
                booking.start
            );

        if (
            date.getTime() <=
            currentTimestamp
        ) {
            continue;
        }

        if (
            !closest ||
            date.getTime() <
            new Date(
                closest.date +
                "T" +
                closest.start
            ).getTime()
        ) {

            closest = booking;

        }

    }

    return closest;
}


/*
==========================================================
 RENDERA BOKNINGAR
==========================================================
*/

function renderBookings() {

    const list =
        document.getElementById(
            "bookingList"
        );

    const count =
        document.getElementById(
            "bookingCount"
        );


    const sorted =
        [...bookings].sort(
            (a, b) => {

                const A =
                    new Date(
                        a.date +
                        "T" +
                        a.start
                    );

                const B =
                    new Date(
                        b.date +
                        "T" +
                        b.start
                    );

                return A - B;

            }
        );


    if (!sorted.length) {

        list.innerHTML =
            `<div class="empty">
                Inga kommande bokningar.
             </div>`;

        count.textContent =
            "0 bokningar";

        return;
    }


    count.textContent =
        `${sorted.length} ${
            sorted.length === 1
                ? "bokning"
                : "bokningar"
        }`;


    list.innerHTML =
        sorted.map(
            booking => {

                const end =
                    timeToMinutes(
                        booking.start
                    ) +
                    booking.duration * 60;

                const endTime =
                    minutesToTime(end);


                return `

                <div class="booking">

                    <div class="booking-date">

                        <span class="day">
                            ${dayNumber(booking.date)}
                        </span>

                        <span class="month">
                            ${monthShort(booking.date)}
                        </span>

                    </div>


                    <div class="booking-main">

                        <div class="booking-time">
                            ${booking.start}
                            →
                            ${endTime}
                        </div>

                        <div class="booking-meta">
                            ${formatDate(booking.date)}
                        </div>

                    </div>


                    <div class="booking-duration">
                        ${booking.duration}
                        ${booking.duration === 1
                            ? "h"
                            : "h"}
                    </div>

                </div>

                `;

            }
        ).join("");
}


/*
==========================================================
 QUICK BUTTONS
==========================================================
*/

function selectQuick(type) {

    const today =
        todayString();

    if (type === "now") {

        document.getElementById(
            "date"
        ).value = today;


        const now =
            new Date();

        /*
        Avrunda aktuell tid till
        närmaste 30 minuter.
        */

        let minutes =
            now.getHours() * 60 +
            now.getMinutes();

        minutes =
            Math.ceil(minutes / 30) * 30;

        if (minutes >= 1440) {
            minutes = 0;
        }

        document.getElementById(
            "startTime"
        ).value =
            minutesToTime(minutes);

    }


    if (type === "today") {

        document.getElementById(
            "date"
        ).value =
            today;

    }


    if (type === "tomorrow") {

        document.getElementById(
            "date"
        ).value =
            datePlusDays(1);

    }


    document
        .querySelectorAll(".quick button")
        .forEach(button => {
            button.classList.remove(
                "active"
            );
        });


    const button =
        document.getElementById(
            type + "Button"
        );

    if (button) {
        button.classList.add(
            "active"
        );
    }


    updatePreview();
}


/*
==========================================================
 FÖRHANDSVISNING
==========================================================
*/

function updatePreview() {

    const date =
        document.getElementById(
            "date"
        ).value;

    const start =
        document.getElementById(
            "startTime"
        ).value;

    const duration =
        Number(
            document.getElementById(
                "duration"
            ).value
        );


    if (!date || !start) {
        return;
    }


    const end =
        timeToMinutes(start) +
        duration * 60;


    document.getElementById(
        "previewTime"
    ).textContent =
        `${start} → ${minutesToTime(end)}`;


    document.getElementById(
        "previewDate"
    ).textContent =
        formatDate(date);
}


/*
==========================================================
 KOLLISION
==========================================================
*/

function hasConflict(
    date,
    start,
    duration
) {

    const newStart =
        timeToMinutes(start);

    const newEnd =
        newStart +
        duration * 60;


    for (const booking of bookings) {

        if (
            booking.date !==
            date
        ) {
            continue;
        }


        const existingStart =
            timeToMinutes(
                booking.start
            );

        const existingEnd =
            existingStart +
            booking.duration * 60;


        /*
        Två tider överlappar om:

        ny start < gammal slut
        OCH
        ny slut > gammal start
        */

        if (
            newStart < existingEnd &&
            newEnd > existingStart
        ) {

            return booking;

        }

    }


    return null;
}


/*
==========================================================
 VISA MEDDELANDE
==========================================================
*/

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        `message show ${type}`;


    setTimeout(() => {

        message.className =
            "message";

    }, 3500);
}


/*
==========================================================
 BOKA
==========================================================
*/

function bookSauna() {

    const date =
        document.getElementById(
            "date"
        ).value;

    const start =
        document.getElementById(
            "startTime"
        ).value;

    const duration =
        Number(
            document.getElementById(
                "duration"
            ).value
        );


    if (!date || !start) {

        showMessage(
            "Välj datum och tid.",
            "error"
        );

        return;
    }


    /*
    Kontrollera att tiden inte
    redan passerat.
    */

    const selected =
        new Date(
            date +
            "T" +
            start
        );


    if (
        selected.getTime() <
        Date.now()
    ) {

        showMessage(
            "Du kan inte boka en tid som redan har passerat.",
            "error"
        );

        return;
    }


    /*
    Kontrollera överlappning.
    */

    const conflict =
        hasConflict(
            date,
            start,
            duration
        );


    if (conflict) {

        const conflictEnd =
            minutesToTime(
                timeToMinutes(
                    conflict.start
                ) +
                conflict.duration * 60
            );


        showMessage(
            `Tiden är redan bokad ${conflict.start} → ${conflictEnd}.`,
            "error"
        );

        return;
    }


    /*
    Lägg till bokningen.

    I Firebase-versionen kommer
    detta istället att skrivas
    till Firestore.
    */

    bookings.push({

        id:
            Date.now(),

        date:
            date,

        start:
            start,

        duration:
            duration

    });


    renderBookings();

    updateStatus();

    updatePreview();


    showMessage(
        "Bastun är bokad! 🔥",
        "success"
    );
}
