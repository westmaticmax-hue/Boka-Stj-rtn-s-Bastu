<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>Boka bastun</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        background: #f4f1eb;
        color: #29251f;
    }

    body {
        display: flex;
        justify-content: center;
    }

    .app {
        width: 100%;
        max-width: 430px;
        min-height: 100vh;
        padding: 18px 16px 28px;
    }

    .header {
        text-align: center;
        margin-bottom: 16px;
    }

    .fire {
        font-size: 28px;
        line-height: 1;
        margin-bottom: 5px;
    }

    h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.4px;
    }

    .subtitle {
        margin-top: 4px;
        font-size: 13px;
        color: #777067;
    }

    /* STATUS */

    .status {
        background: #fff;
        border-radius: 16px;
        padding: 13px 15px;
        margin-bottom: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .status-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .status-dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #56a45d;
        flex: 0 0 auto;
    }

    .status-dot.busy {
        background: #d46a45;
    }

    .status-title {
        font-size: 13px;
        color: #777067;
        margin-bottom: 1px;
    }

    .status-value {
        font-size: 17px;
        font-weight: 700;
    }

    .status-time {
        font-size: 12px;
        color: #777067;
        text-align: right;
    }

    /* QUICK BUTTONS */

    .quick {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 13px;
    }

    .quick button {
        border: 0;
        background: #fff;
        color: #38322b;
        border-radius: 12px;
        padding: 11px 5px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: 0 1px 4px rgba(0,0,0,.06);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .quick button:active {
        transform: scale(.98);
    }

    .quick button.active {
        background: #302b25;
        color: #fff;
    }

    /* BOOKING FORM */

    .card {
        background: #fff;
        border-radius: 16px;
        padding: 15px;
        box-shadow: 0 1px 4px rgba(0,0,0,.07);
        margin-bottom: 13px;
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
        margin-bottom: 11px;
    }

    .field {
        display: flex;
        flex-direction: column;
    }

    label {
        font-size: 12px;
        color: #777067;
        margin: 0 0 5px 2px;
    }

    input,
    select {
        width: 100%;
        height: 43px;
        border: 1px solid #ddd7cf;
        border-radius: 10px;
        background: #faf9f7;
        color: #29251f;
        font-size: 16px;
        padding: 0 10px;
        outline: none;
        font-family: inherit;
    }

    input:focus,
    select:focus {
        border-color: #aaa096;
    }

    .preview-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .7px;
        color: #8a8178;
        margin: 2px 0 4px;
    }

    .preview {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .book-button {
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 12px;
        background: #302b25;
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .book-button:active {
        transform: scale(.99);
    }

    .book-button:disabled {
        opacity: .5;
        cursor: default;
    }

    /* CURRENT BOOKING */

    .bookings-card {
        background: #fff;
        border-radius: 16px;
        padding: 15px;
        box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .section-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .7px;
        color: #8a8178;
        margin-bottom: 9px;
    }

    .booking {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid #eee9e3;
    }

    .booking:first-of-type {
        border-top: 0;
        padding-top: 0;
    }

    .booking-date {
        font-size: 11px;
        color: #8a8178;
        text-transform: uppercase;
        margin-bottom: 2px;
    }

    .booking-time {
        font-size: 16px;
        font-weight: 700;
    }

    .booking-duration {
        font-size: 12px;
        color: #777067;
        margin-top: 2px;
    }

    .booking-state {
        font-size: 11px;
        font-weight: 600;
        color: #56a45d;
        white-space: nowrap;
    }

    .empty {
        font-size: 13px;
        color: #8a8178;
        padding: 2px 0;
    }

    .message {
        margin-top: 10px;
        font-size: 13px;
        text-align: center;
        min-height: 18px;
    }

    .message.error {
        color: #b54835;
    }

    .message.ok {
        color: #4d8f53;
    }

    .footer {
        text-align: center;
        margin-top: 16px;
        font-size: 10px;
        color: #aaa198;
    }

    @media (max-width: 350px) {
        .app {
            padding-left: 12px;
            padding-right: 12px;
        }

        h1 {
            font-size: 23px;
        }

        .row {
            gap: 8px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="fire">🔥</div>
        <h1>Boka bastun</h1>
        <div class="subtitle">Glöm inte att göra fint efter Er</div>
    </div>


    <!-- STATUS -->

    <div class="status">

        <div class="status-left">
            <div id="statusDot" class="status-dot"></div>

            <div>
                <div class="status-title">Status</div>
                <div id="statusValue" class="status-value">Ledig</div>
            </div>
        </div>

        <div id="statusTime" class="status-time"></div>

    </div>


    <!-- SNABBVAL -->

    <div class="quick">

        <button id="nowButton">Nu</button>

        <button id="todayButton">Idag</button>

        <button id="tomorrowButton">Imorgon</button>

    </div>


    <!-- BOKNING -->

    <div class="card">

        <div class="row">

            <div class="field">
                <label for="date">Datum</label>
                <input id="date" type="date">
            </div>

            <div class="field">
                <label for="time">Start</label>
                <input id="time" type="time">
            </div>

        </div>


        <div class="field" style="margin-bottom:12px;">
            <label for="duration">Längd</label>

            <select id="duration">
                <option value="1">1 timme</option>
                <option value="2">2 timmar</option>
                <option value="3" selected>3 timmar</option>
            </select>
        </div>


        <div class="preview-title">DIN BOKNING</div>

        <div id="preview" class="preview">
            -
        </div>


        <button id="bookButton" class="book-button">
            Boka bastu
        </button>

        <div id="message" class="message"></div>

    </div>


    <!-- BOKNINGAR -->

    <div class="bookings-card">

        <div class="section-title">
            AKTUELLA BOKNINGAR
        </div>

        <div id="bookingsList">
            <div class="empty">Laddar...</div>
        </div>

    </div>


    <div class="footer">
        Boka bastun
    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
   ========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    orderBy,
    onSnapshot,
    Timestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDLcidVFvfuuoVNNzv9PAFQl6-qI6vHXW0",
    authDomain: "boka-bastu.firebaseapp.com",
    projectId: "boka-bastu",
    storageBucket: "boka-bastu.firebasestorage.app",
    messagingSenderId: "605683023531",
    appId: "1:605683023531:web:92edea0e3765726e4d41ee"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const bookingsRef = collection(db, "bookings");


/* =========================================================
   ELEMENT
   ========================================================= */

const dateInput = document.getElementById("date");
const timeInput = document.getElementById("time");
const durationInput = document.getElementById("duration");

const preview = document.getElementById("preview");

const bookButton = document.getElementById("bookButton");

const message = document.getElementById("message");

const bookingsList = document.getElementById("bookingsList");

const statusValue = document.getElementById("statusValue");
const statusTime = document.getElementById("statusTime");
const statusDot = document.getElementById("statusDot");

const nowButton = document.getElementById("nowButton");
const todayButton = document.getElementById("todayButton");
const tomorrowButton = document.getElementById("tomorrowButton");


/* =========================================================
   DATA
   ========================================================= */

let currentUser = null;

let bookings = [];

let unsubscribeBookings = null;


/* =========================================================
   DATUM / TID
   ========================================================= */

function pad(number) {
    return String(number).padStart(2, "0");
}


function localDateString(date = new Date()) {

    return (
        date.getFullYear() +
        "-" +
        pad(date.getMonth() + 1) +
        "-" +
        pad(date.getDate())
    );
}


function localTimeString(date = new Date()) {

    return (
        pad(date.getHours()) +
        ":" +
        pad(date.getMinutes())
    );
}


function roundUp15Minutes(date) {

    const d = new Date(date);

    d.setSeconds(0, 0);

    const minutes = d.getMinutes();

    const rounded = Math.ceil(minutes / 15) * 15;

    if (rounded >= 60) {
        d.setHours(d.getHours() + 1);
        d.setMinutes(0);
    } else {
        d.setMinutes(rounded);
    }

    return d;
}


function dateTimeFromBooking(booking) {

    return new Date(
        `${booking.date}T${booking.start}:00`
    );
}


function endDateTimeFromBooking(booking) {

    const start = dateTimeFromBooking(booking);

    return new Date(
        start.getTime() +
        Number(booking.duration) * 60 * 60 * 1000
    );
}


function formatDate(dateString) {

    const date = new Date(dateString + "T12:00:00");

    const months = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAJ",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OKT",
        "NOV",
        "DEC"
    ];

    return (
        date.getDate() +
        " " +
        months[date.getMonth()]
    );
}


/* =========================================================
   FORMULÄR
   ========================================================= */

function setToday() {

    const now = new Date();

    dateInput.value = localDateString(now);

    updateQuickButtons("today");

    updatePreview();
}


function setTomorrow() {

    const tomorrow = new Date();

    tomorrow.setDate(tomorrow.getDate() + 1);

    dateInput.value = localDateString(tomorrow);

    updateQuickButtons("tomorrow");

    updatePreview();
}


function setNow() {

    const now = roundUp15Minutes(new Date());

    dateInput.value = localDateString(now);

    timeInput.value = localTimeString(now);

    updateQuickButtons("now");

    updatePreview();
}


function updateQuickButtons(active) {

    nowButton.classList.toggle(
        "active",
        active === "now"
    );

    todayButton.classList.toggle(
        "active",
        active === "today"
    );

    tomorrowButton.classList.toggle(
        "active",
        active === "tomorrow"
    );
}


/* =========================================================
   FÖRHANDSVISNING
   ========================================================= */

function updatePreview() {

    if (!dateInput.value || !timeInput.value) {

        preview.textContent = "-";

        return;
    }

    const duration =
        Number(durationInput.value);

    const start =
        new Date(
            `${dateInput.value}T${timeInput.value}:00`
        );

    const end =
        new Date(
            start.getTime() +
            duration * 60 * 60 * 1000
        );

    preview.textContent =
        `${formatDate(dateInput.value)}  ` +
        `${pad(start.getHours())}:${pad(start.getMinutes())}` +
        ` → ` +
        `${pad(end.getHours())}:${pad(end.getMinutes())}`;
}


/* =========================================================
   MEDDELANDE
   ========================================================= */

function showMessage(text, type = "") {

    message.textContent = text;

    message.className =
        "message " + type;

    if (text) {

        setTimeout(() => {

            if (message.textContent === text) {

                message.textContent = "";

                message.className = "message";

            }

        }, 4000);
    }
}


/* =========================================================
   ÖVERLAPPANDE BOKNING
   ========================================================= */

function bookingsOverlap(
    newStart,
    newEnd,
    existingBooking
) {

    const existingStart =
        dateTimeFromBooking(existingBooking);

    const existingEnd =
        endDateTimeFromBooking(existingBooking);

    return (
        newStart < existingEnd &&
        newEnd > existingStart
    );
}


/* =========================================================
   RADERA GAMLA BOKNINGAR
   ========================================================= */

async function removeExpiredBookings() {

    if (!currentUser) {
        return;
    }

    const now = new Date();

    const expiredBookings =
        bookings.filter(booking => {

            const end =
                endDateTimeFromBooking(booking);

            return end <= now;
        });


    if (expiredBookings.length === 0) {
        return;
    }


    for (const booking of expiredBookings) {

        try {

            await deleteDoc(
                doc(db, "bookings", booking.id)
            );

        } catch (error) {

            /*
             * Om säkerhetsregeln stoppar en gammal
             * bokning utan expiresAt ignoreras felet.
             * Den kan då tas bort manuellt i Firebase.
             */

            console.log(
                "Kunde inte radera gammal bokning:",
                error
            );
        }
    }
}


/* =========================================================
   STATUS
   ========================================================= */

function updateStatus() {

    const now = new Date();

    const currentBooking =
        bookings.find(booking => {

            const start =
                dateTimeFromBooking(booking);

            const end =
                endDateTimeFromBooking(booking);

            return (
                now >= start &&
                now < end
            );
        });


    if (currentBooking) {

        statusValue.textContent = "Bokad";

        statusDot.classList.add("busy");

        const end =
            endDateTimeFromBooking(currentBooking);

        statusTime.textContent =
            "Till " +
            pad(end.getHours()) +
            ":" +
            pad(end.getMinutes());

    } else {

        statusValue.textContent = "Ledig";

        statusDot.classList.remove("busy");

        statusTime.textContent = "";
    }
}


/* =========================================================
   VISA BOKNINGAR
   ========================================================= */

function renderBookings() {

    const now = new Date();

    const activeBookings =
        bookings
            .filter(booking => {

                return (
                    endDateTimeFromBooking(booking) >
                    now
                );
            })
            .sort((a, b) => {

                return (
                    dateTimeFromBooking(a) -
                    dateTimeFromBooking(b)
                );
            });


    if (activeBookings.length === 0) {

        bookingsList.innerHTML =
            '<div class="empty">Inga aktuella bokningar</div>';

        return;
    }


    bookingsList.innerHTML =
        activeBookings.map(booking => {

            const start =
                dateTimeFromBooking(booking);

            const end =
                endDateTimeFromBooking(booking);

            const isCurrent =
                now >= start &&
                now < end;


            return `
                <div class="booking">

                    <div>

                        <div class="booking-date">
                            ${formatDate(booking.date)}
                        </div>

                        <div class="booking-time">
                            ${pad(start.getHours())}:${pad(start.getMinutes())}
                            →
                            ${pad(end.getHours())}:${pad(end.getMinutes())}
                        </div>

                        <div class="booking-duration">
                            ${booking.duration} ${Number(booking.duration) === 1 ? "timme" : "timmar"}
                        </div>

                    </div>

                    <div class="booking-state">
                        ${isCurrent ? "PÅGÅR" : "BOKAD"}
                    </div>

                </div>
            `;

        }).join("");
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    updateStatus();

    renderBookings();

    updatePreview();
}


/* =========================================================
   LIVE FIRESTORE
   ========================================================= */

function startRealtimeListener() {

    if (unsubscribeBookings) {

        unsubscribeBookings();

        unsubscribeBookings = null;
    }


    const bookingsQuery =
        query(
            bookingsRef,
            orderBy("date"),
            orderBy("start")
        );


    unsubscribeBookings =
        onSnapshot(
            bookingsQuery,

            snapshot => {

                bookings =
                    snapshot.docs.map(item => {

                        return {
                            id: item.id,
                            ...item.data()
                        };

                    });


                render();

                removeExpiredBookings();

            },

            error => {

                console.error(
                    "Firestore listener:",
                    error
                );

                showMessage(
                    "Kunde inte läsa bokningarna.",
                    "error"
                );
            }
        );
}


/* =========================================================
   SKAPA BOKNING
   ========================================================= */

async function createBooking() {

    if (!currentUser) {

        showMessage(
            "Ansluter till Firebase...",
            "error"
        );

        return;
    }


    if (!dateInput.value || !timeInput.value) {

        showMessage(
            "Välj datum och starttid.",
            "error"
        );

        return;
    }


    const duration =
        Number(durationInput.value);


    const start =
        new Date(
            `${dateInput.value}T${timeInput.value}:00`
        );


    const end =
        new Date(
            start.getTime() +
            duration * 60 * 60 * 1000
        );


    const now = new Date();


    if (end <= now) {

        showMessage(
            "Bokningen har redan passerat.",
            "error"
        );

        return;
    }


    /* Kontrollera gamla/utgångna bokningar först */

    await removeExpiredBookings();


    /* Kontrollera om tiden redan är bokad */

    const conflict =
        bookings.find(booking => {

            return bookingsOverlap(
                start,
                end,
                booking
            );
        });


    if (conflict) {

        const conflictStart =
            dateTimeFromBooking(conflict);

        const conflictEnd =
            endDateTimeFromBooking(conflict);

        showMessage(
            `Tiden är redan bokad ${pad(conflictStart.getHours())}:${pad(conflictStart.getMinutes())}–${pad(conflictEnd.getHours())}:${pad(conflictEnd.getMinutes())}.`,
            "error"
        );

        return;
    }


    bookButton.disabled = true;

    bookButton.textContent = "Bokar...";


    try {

        /*
         * expiresAt används av Firestore-reglerna
         * för att tillåta automatisk radering efter
         * att bokningen är slut.
         */

        await addDoc(
            bookingsRef,
            {
                date: dateInput.value,

                start: timeInput.value,

                duration: duration,

                uid: currentUser.uid,

                createdAt: Timestamp.now(),

                expiresAt: Timestamp.fromDate(end)
            }
        );


        showMessage(
            "Bastun är bokad!",
            "ok"
        );


        /*
         * Lyssnaren uppdaterar automatiskt
         * listan på alla anslutna telefoner.
         */

        render();


    } catch (error) {

        console.error(
            "Kunde inte spara bokningen:",
            error
        );


        showMessage(
            "Kunde inte spara bokningen: " +
            (error.message || error),
            "error"
        );

    } finally {

        bookButton.disabled = false;

        bookButton.textContent = "Boka bastu";
    }
}


/* =========================================================
   KNAPPAR
   ========================================================= */

nowButton.addEventListener(
    "click",
    setNow
);


todayButton.addEventListener(
    "click",
    setToday
);


tomorrowButton.addEventListener(
    "click",
    setTomorrow
);


dateInput.addEventListener(
    "change",
    () => {

        updateQuickButtons("");

        updatePreview();
    }
);


timeInput.addEventListener(
    "change",
    updatePreview
);


durationInput.addEventListener(
    "change",
    updatePreview
);


bookButton.addEventListener(
    "click",
    createBooking
);


/* =========================================================
   START
   ========================================================= */

function initializeForm() {

    const now =
        roundUp15Minutes(new Date());

    dateInput.value =
        localDateString(now);

    timeInput.value =
        localTimeString(now);

    durationInput.value = "3";

    updateQuickButtons("now");

    updatePreview();
}


initializeForm();


/* =========================================================
   FIREBASE AUTH
   ========================================================= */

signInAnonymously(auth)
    .catch(error => {

        console.error(
            "Firebase inloggning:",
            error
        );

        showMessage(
            "Kunde inte ansluta till Firebase.",
            "error"
        );
    });


onAuthStateChanged(
    auth,
    user => {

        currentUser = user;

        if (user) {

            startRealtimeListener();

            render();

        }
    }
);


/* =========================================================
   LIVE UPPDATERING
   ========================================================= */

setInterval(
    () => {

        updateStatus();

        renderBookings();

        removeExpiredBookings();

    },
    5000
);

</script>

</body>
</html>
